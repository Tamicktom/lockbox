
services:
  app:
    image: php:8.3-fpm-alpine
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html:delegated
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - web
  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:delegated
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
